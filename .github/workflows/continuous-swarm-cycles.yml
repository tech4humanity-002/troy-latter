name: Continuous Swarm Cycles

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: continuous-swarm-cycles
  cancel-in-progress: false

jobs:
  five-cycles:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Run five verified durable cycles
        shell: bash
        run: |
          set -u
          url="https://pflisxkcxbzboxwidywf.supabase.co/functions/v1/t4h-world-continuous-cycle"
          successful=0
          attempts=0
          while [ "$successful" -lt 5 ] && [ "$attempts" -lt 20 ]; do
            attempts=$((attempts + 1))
            echo "=== ATTEMPT ${attempts} | VERIFIED ${successful}/5 ==="
            response=$(curl --silent --show-error --max-time 180 --write-out '\nHTTP_STATUS:%{http_code}' "$url" || true)
            echo "$response"
            body="${response%HTTP_STATUS:*}"
            if echo "$body" | grep -q '"status":"REAL"'; then
              successful=$((successful + 1))
              echo "VERIFIED REAL CYCLE ${successful}/5"
            else
              echo "Cycle not verified. Retrying without counting it."
            fi
            sleep 5
          done
          if [ "$successful" -ne 5 ]; then
            echo "FIVE VERIFIED CYCLES NOT REACHED"
            exit 1
          fi
          echo "=== FIVE VERIFIED CYCLES COMPLETE ==="
          echo "The scheduled workflow replenishes and starts the next batch continuously."
